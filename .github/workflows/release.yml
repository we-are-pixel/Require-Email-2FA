name: Release

# Merging to main with a new version in force-email-two-factor.php publishes a GitHub
# release. Sites (and MainWP) then show the update; nothing installs on its own.

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: New version?
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      new: ${{ steps.version.outputs.new }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: version
        run: |
          version="$(sed -n 's/^ \* Version: *//p' force-email-two-factor.php)"
          constant="$(sed -n "s/^define( 'FORCE_2FA_VERSION', '\(.*\)' );/\1/p" force-email-two-factor.php)"
          if [ "$version" != "$constant" ]; then
            echo "::error::Version header ($version) and FORCE_2FA_VERSION ($constant) differ."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Exit code 2 means "no such tag"; anything else is a lookup error, not a new version.
          status=0
          git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null || status=$?
          case "$status" in
            0) echo "new=false" >> "$GITHUB_OUTPUT" ;;
            2) echo "new=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::Could not check tags (git exit $status)."; exit 1 ;;
          esac

  checks:
    needs: version
    if: needs.version.outputs.new == 'true'
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish v${{ needs.version.outputs.version }}
    needs: [version, checks]
    runs-on: ubuntu-latest
    # Waits for a required reviewer to approve (Settings -> Environments -> release).
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v${{ needs.version.outputs.version }}
      ZIP: dist/Require-Email-2FA-main.zip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Besides admins, only this deploy key may create tags (Settings -> Rules).
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
      - run: bash bin/build.sh dist
      - name: Check the zip
        run: |
          paths="$(zipinfo -1 "$ZIP")"
          grep -qx 'Require-Email-2FA-main/force-email-two-factor.php' <<<"$paths"
          grep -qx 'Require-Email-2FA-main/vendor/yahnis-elsts/plugin-update-checker/plugin-update-checker.php' <<<"$paths"
          if grep -v '^Require-Email-2FA-main/' <<<"$paths" || grep -E '^Require-Email-2FA-main/(tests|bin|\.github)/' <<<"$paths"; then
            echo "::error::The zip must contain only the plugin, inside Require-Email-2FA-main/."
            exit 1
          fi
      # Signed proof that this zip was built here, from this commit: gh attestation verify.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ env.ZIP }}
      # Draft first, so sites never see a release without its zip. The deploy key pushes
      # the tag because the Actions token may not create tags.
      - run: |
          gh release create "$TAG" "$ZIP" --draft --target "$GITHUB_SHA" --title "$TAG" --generate-notes
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"
          gh release edit "$TAG" --draft=false --latest
