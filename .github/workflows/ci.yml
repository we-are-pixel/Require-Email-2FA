name: CI

on:
  pull_request:
  # Weekly, to catch a WordPress or Two Factor release that breaks enforcement.
  schedule:
    - cron: '0 6 * * 1'
  workflow_call:

permissions:
  contents: read

jobs:
  standards:
    name: Coding standards and static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          coverage: none
      - run: composer install --no-interaction --no-progress
      - run: composer audit
      - run: composer lint
      - run: composer analyse

  tests:
    name: Tests (PHP ${{ matrix.php }}, WordPress ${{ matrix.wp }}, Two Factor ${{ matrix.two-factor || 'latest' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '7.2'
            wp: '6.7'
            two-factor: '0.14.2'
            # 1.12+ need WordPress 6.8, so 6.7 sites can only be on 1.11.
            from: 'v1.11.0'
          - php: '7.4'
            wp: '6.9'
            two-factor: '0.16.0'
          - php: '8.4'
            wp: latest
            two-factor: ''
    env:
      WP_PHP: php${{ matrix.php }}
      WP_VERSION: ${{ matrix.wp }}
      TWO_FACTOR_VERSION: ${{ matrix.two-factor }}
      FROM_VERSIONS: ${{ matrix.from }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # The test sites run on the matrix PHP; the test runner (PHPUnit 11) needs 8.3.
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, mbstring, pdo_sqlite, sqlite3, xml, zip
          coverage: none
          tools: none
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          coverage: none
      - run: composer install --no-interaction --no-progress
      - run: composer test
      - run: composer test:e2e
      - run: composer test:upgrade

  # The one check the main branch rule requires, so changing the matrix never breaks the rule.
  passed:
    name: CI passed
    # Always runs: a skipped required check would count as passed.
    if: always()
    needs: [standards, tests]
    runs-on: ubuntu-latest
    steps:
      - run: '[ "${{ needs.standards.result }}" = success ] && [ "${{ needs.tests.result }}" = success ]'
